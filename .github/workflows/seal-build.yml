# Upstream golang.org/x/net has no GitHub Actions CI (it is developed on Gerrit
# and tested by the Go project's own builders), so this workflow is written for
# the sealing pipeline. It mirrors what the Go builders do for an x/ repo:
# `go build ./...` plus `go test ./...` against the toolchain the module's own
# `go` directive requires, and it packs the module source zip that
# proxy.golang.org serves for this version.
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Space-separated top-level test names to run; empty runs the full suite"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Report toolchain
        run: go version

      # Pack the module zip FIRST, from a pristine copy of the tree, so no
      # build or test byproduct can leak into the artifact. The copy drops
      # .github/ because upstream ships none: this workflow and its zip helper
      # travel in the version patch, not inside the published module zip.
      - name: Stage module source
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/modsrc"
          cp -a "$GITHUB_WORKSPACE" "$RUNNER_TEMP/modsrc"
          rm -rf "$RUNNER_TEMP/modsrc/.git" "$RUNNER_TEMP/modsrc/.github"

      - name: Pack module zip
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zipper" "$GITHUB_WORKSPACE/build_output"
          cp "$GITHUB_WORKSPACE/.github/seal/create_mod.go" "$RUNNER_TEMP/zipper/"
          cd "$RUNNER_TEMP/zipper"
          go mod init example.com/zipper
          go get golang.org/x/mod@v0.28.0
          go run ./create_mod.go golang.org/x/net v0.45.0 "$RUNNER_TEMP/modsrc" "$GITHUB_WORKSPACE/build_output/v0.45.0.zip"
          unzip -l "$GITHUB_WORKSPACE/build_output/v0.45.0.zip" | tail -5

      - name: Build
        run: go build ./...

      - name: Test
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          set -eo pipefail
          if [ -n "$TEST_FILTER" ]; then
            go test -v -run "^($(echo "$TEST_FILTER" | tr ' ' '|'))$" ./... 2>&1 | tee /tmp/scoped.log
            for t in $TEST_FILTER; do
              grep -qE "^=== RUN[[:space:]]+${t}(/|$)" /tmp/scoped.log || exit 1
            done
          else
            go test ./...
          fi

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: build_output/v0.45.0.zip
          if-no-files-found: error
